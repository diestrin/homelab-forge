name: family-agile-sync image

on:
  push:
    branches: [main]
    paths:
      - "apps/family-agile-sync/**"
      - ".github/workflows/family-agile-sync-image.yml"
  pull_request:
    paths:
      - "apps/family-agile-sync/**"
      - ".github/workflows/family-agile-sync-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/family-agile-sync
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/family-agile-sync/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    name: build and publish
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/family-agile-sync/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/diestrin/homelab-forge/family-agile-sync:main
            ghcr.io/diestrin/homelab-forge/family-agile-sync:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
