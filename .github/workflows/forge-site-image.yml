name: forge-site image

on:
  push:
    branches: [main]
    paths:
      - "apps/forge-site/**"
      - "factory/tasks/**"
      - ".github/workflows/forge-site-image.yml"
  pull_request:
    paths:
      - "apps/forge-site/**"
      - "factory/tasks/**"
      - ".github/workflows/forge-site-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/forge-site/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/diestrin/homelab-forge/forge-site:main
            ghcr.io/diestrin/homelab-forge/forge-site:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  next-build:
    name: next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forge-site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/forge-site/package-lock.json
      - run: npm ci
      - run: npm run build
