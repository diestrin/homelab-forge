name: forge-site preview (manual)

on:
  workflow_dispatch:
    inputs:
      action:
        description: Create or delete a preview environment
        required: true
        type: choice
        options:
          - deploy
          - delete
      pr_number:
        description: Pull request number (used for namespace and hostname)
        required: true
        type: string
      ref:
        description: Git ref to build (branch or SHA); required for deploy
        required: false
        type: string

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  build:
    name: build and push preview image
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/diestrin/homelab-forge/forge-site:pr-${{ inputs.pr_number }}-${{ steps.meta.outputs.sha }}
      branch: ${{ steps.meta.outputs.branch }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve branch name
        id: meta
        env:
          INPUT_REF: ${{ inputs.ref }}
          PREVIEW_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ -z "${INPUT_REF}" ]]; then
            echo "ref input is required for deploy" >&2
            exit 1
          fi
          if [[ ! "${PREVIEW_PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "pr_number must be digits" >&2
            exit 1
          fi
          branch="$(git rev-parse --abbrev-ref HEAD)"
          if [[ "${branch}" == "HEAD" ]]; then
            branch="${INPUT_REF}"
          fi
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/forge-site/Dockerfile
          push: true
          tags: ghcr.io/diestrin/homelab-forge/forge-site:pr-${{ inputs.pr_number }}-${{ steps.meta.outputs.sha }}

  deploy:
    name: manual deploy preview
    needs: build
    if: inputs.action == 'deploy' && vars.FORGE_PREVIEW_ENABLED == 'true'
    runs-on: [self-hosted, k3s, forge-preview]
    timeout-minutes: 15
    env:
      PREVIEW_PR_NUMBER: ${{ inputs.pr_number }}
      PREVIEW_IMAGE: ${{ needs.build.outputs.image }}
      PREVIEW_HOST: pr-${{ inputs.pr_number }}.localpower.diegobarahona.com
      PREVIEW_BRANCH: ${{ needs.build.outputs.branch }}
    steps:
      - uses: actions/checkout@v7

      - name: Apply preview stack
        run: |
          set -euo pipefail
          ./k8s/preview/forge-site/render.sh | kubectl apply -f -
          kubectl -n "forge-preview-${PREVIEW_PR_NUMBER}" rollout status deployment/forge-site --timeout=300s
          url="https://${PREVIEW_HOST}/"
          {
            echo "## Manual forge-site preview"
            echo "**URL:** ${url}"
            echo "**Image:** \`${PREVIEW_IMAGE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  delete:
    name: manual delete preview
    if: inputs.action == 'delete' && vars.FORGE_PREVIEW_ENABLED == 'true'
    runs-on: [self-hosted, k3s, forge-preview]
    timeout-minutes: 10
    env:
      PREVIEW_PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - name: Delete preview namespace
        run: |
          set -euo pipefail
          if [[ ! "${PREVIEW_PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "pr_number must be digits" >&2
            exit 1
          fi
          ns="forge-preview-${PREVIEW_PR_NUMBER}"
          kubectl delete namespace "${ns}" --ignore-not-found --wait=false
          echo "Deleted (or absent): ${ns}" >> "${GITHUB_STEP_SUMMARY}"
