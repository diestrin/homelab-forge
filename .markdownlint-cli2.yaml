# markdownlint-cli2 config (CI: markdown-lint job).
config:
  # Long lines are fine in prose/tables; diffs stay readable either way.
  MD013: false
  # Allow duplicate headings across sibling sections (e.g. per-phase "Tasks").
  MD024:
    siblings_only: true

ignores:
  - "**/.direnv/**"
  - "**/node_modules/**"
  # Imported project keeps its own doc style (ADR-005).
  - "security/host-watch/**"
  # Local-only trees (not in git).
  - "backups/**"
