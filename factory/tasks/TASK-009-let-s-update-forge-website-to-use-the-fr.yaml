id: TASK-009
title: Redesign forge-site landing + PR preview runner in k3s
goal: >
  Improve the public forge-site landing page (apps/forge-site) using the
  frontend-design Cursor skill: clearer concept explanation with images/icons,
  a FAQ section, and interactive background effects. Install a GitHub Actions
  self-hosted runner inside the k3s cluster as the CI bridge to the control plane
  for ephemeral PR preview environments at
  pr-{PR_NUMBER}.localpower.diegobarahona.com. Worker implements after plan
  approval; humans merge steady-state manifests; Argo CD syncs forge-site and
  runner manifests; preview deploy/teardown runs via in-cluster workflow jobs.
acceptance_criteria:
- Landing route at / in apps/forge-site is redesigned following the frontend-design
  Cursor skill (distinctive aesthetic, deliberate typography/palette, not generic
  AI-template defaults)
- Forge components and factory workflow sections use images and/or icons to
  illustrate concepts (SVG, optimized raster, or icon set committed in-repo or via
  existing deps; no hotlinked external assets required at runtime)
- New FAQ section on the landing page with at least five Q&A entries about Forge,
  the factory pipeline, and how operators interact with it; accordion or equivalent
  accessible expand/collapse
- Interactive background effect on the landing page (canvas, CSS, or lightweight
  animation) that respects prefers-reduced-motion and remains usable on mobile
- GitHub Actions self-hosted runner deployed in k3s (manifests in repo under k8s/,
  Argo-managed after merge); runner registration credentials from Vault/ESO only,
  not committed to git; RBAC scoped to a preview namespace
- PR preview workflow uses the in-cluster runner to deploy forge-site previews on open
  PRs at https://pr-{PR_NUMBER}.localpower.diegobarahona.com with valid TLS; preview
  resources are removed when the PR closes; steady-state forge-site on the root host
  is unchanged
- Dashboard route and API routes unchanged unless a shared layout tweak is required;
  no new secrets, tokens, Slack user IDs, or private ntfy topics in git
- PR opened against main; factory/review/CHECKLIST.md completed; all CI checks green
  on the PR head (ci.yml, forge-site-image.yml, gitleaks)
- After human merge to main, Argo Application forge-site is Healthy/Synced and HTTPS
  root path shows the redesigned landing; opening a test PR proves preview URL on
  pr-{number}.localpower.diegobarahona.com before merge
sandbox_profile: k8s-workload
repo_path: .
status: planning
risk_level: medium
budget_minutes: 90
branch: factory/task-009-let-s-update-forge-website-to-use-the-fr
worker_hook: null
notes: >
  Slack operator request (2026-08-14): update forge-website to use the
  frontend-design skill — add images/icons for concepts, a FAQ, and interactive
  background effects.

  Operator feedback (2026-08-14): CI is failing on the implementation PR — fix
  markdown lint (e.g. MD047 on .cursor/skills/frontend-design/SKILL.md) and
  confirm all checks green on PR head before review. Plan in-cluster GitHub
  Actions runner in k3s as the bridge for ephemeral env deploys; preview subdomain
  pattern pr-{PR_NUMBER}.localpower.diegobarahona.com (wildcard DNS prerequisite
  documented in plan).

  "forge-website" maps to the existing Next.js app at apps/forge-site (TASK-007),
  served on the public demo hostname via Argo-managed forge-site.

  Status stays planning until operator approves in the Slack thread
  (`approve` / `lgtm` / `/forge approve`) and `./forge factory approve TASK-009`
  moves the task to proposed. The Slack thread will iterate this plan before
  approval; do not treat thread replies as worker scope until re-approved.

  Worker must read and apply `.cursor/skills/frontend-design/SKILL.md` during
  implementation (design plan pass, self-critique, reduced-motion/accessibility
  floor).

  Steady-state deploy path: merge to main → CI publishes forge-site image → Argo CD
  syncs forge-site and runner manifests. Ephemeral previews: in-cluster runner
  workflow only. No worker kubectl apply to Argo-managed steady-state apps.
