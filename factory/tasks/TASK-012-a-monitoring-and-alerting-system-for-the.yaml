notes: |
  Operator request: monitoring + alerting via ntfy and Slack for failing deployments
  and dangerous host resource levels.

  Slack iteration (2026-09-01): operator needed concrete implementation detail before
  approve — plan expanded with forge-alerts Python service, k8s/platform/metrics
  CronJob, Vault paths (forge/ntfy, forge/alerts/slack), alert matrix A1–A8, and
  explicit boundary vs TASK-011 task-thread Slack and security/host-watch (ADR-005).

  Do not auto-approve; ephemeral cluster alert smoke uses throwaway pods in forge-agents
  only, never committed to git.
