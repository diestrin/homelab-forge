  superseded by portfolio feedback below.

  Portfolio iteration (2026-09-01): operator prefers Prometheus + Grafana (dashboards
  to showcase, alerts configured from the observability stack) over a bespoke Python
  CronJob checker. Plan revised: kube-prometheus-stack via Argo CD Helm, PrometheusRule
