id: TASK-012
title: 'a monitoring and alerting system for the forge, capable of sending alert'
goal: |
  Extend platform monitoring so the operator gets ntfy and Slack alerts when
  steady-state deployments (Argo CD Applications and their workloads) are unhealthy
  or the single-node k3s host shows resource pressure — without modifying
  host-watch, UFW, or factory task-thread Slack routing (TASK-011).
acceptance_criteria:
- apps/forge-alerts Python checker with unit tests (pytest) covering Argo app health/sync,
  failing pods, node pressure/utilization, Vault pod, alert dedupe, and dual notify paths
- CronJob forge-alerts in k8s/platform/metrics/ runs the forge-alerts image (*/5 schedule),
  replaces the inline shell alert script; RBAC read-only on nodes, pods, applications, metrics
- ExternalSecret projects secret/forge/ntfy (existing) and secret/forge/alerts/slack
  webhook_url into forge-system; no secrets, webhook URLs, or Slack user IDs in git
- Alerts fire per plan thresholds (A1–A8) with cooldown deduplication; DRY_RUN documented
- .github/workflows/forge-alerts-image.yml builds/pushes image on main; ci green on PR
- apps/forge-alerts/README.md documents Vault bootstrap, Slack Incoming Webhook setup,
  and operator smoke-test procedure
- kubectl kustomize k8s/platform/metrics passes kubeconform; factory/review/CHECKLIST.md
  completed on the PR
- After human merge to main, Argo CD syncs metrics overlay only (ADR-008); worker does not
  kubectl apply Argo-managed apps
sandbox_profile: agent-cell
repo_path: .
status: planning
assignee_agent: null
artifacts: []
risk_level: medium
budget_minutes: 60
