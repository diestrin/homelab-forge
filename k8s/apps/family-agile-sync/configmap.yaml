# Non-secret configuration. Notion database ids are not credentials: without a
# token they grant nothing.
#
# These are the classic *database* ids (the id in the database page URL), which
# is what /v1/databases/{id}/query expects under Notion-Version 2022-06-28 --
# NOT the data-source / collection id shown in some views. Verified 2026-08-26.
apiVersion: v1
kind: ConfigMap
metadata:
  name: family-agile-sync-config
  namespace: family-agile
data:
  NOTION_DB_MIEMBROS: "225667724688805283bee4ed7bdfe3b5"
  NOTION_DB_RUTINAS: "0a6f241192614f63ae84bf9b83687144"
  NOTION_DB_AGENDA: "1f36677246888026b113f11dffecdda7"
  NOTION_DB_TAREAS: "e968d41b12f44f9c8b6b7b75e04161a9"
  # Corte quincenal: the per-member cycle settlement close-cycle writes.
  NOTION_DB_CORTE: "a71a267a472d463899d989cdc7e84c9c"
  # 💵 Sobres / 🔁 Movimientos: the finance module close-cycle deposits into
  # (ADR-013). Optional in Config -- close-cycle still writes the Cortes if
  # either is missing; the other three jobs never touch them.
  NOTION_DB_SOBRES: "d701872d50294804a4fb2c66ae91c068"
  NOTION_DB_MOVIMIENTOS: "ef070eb6e63d46539558aca46081bf25"
  # DISTRIBUTE unset -> deposit runs. Set DISTRIBUTE="0" for a parallel cycle
  # that writes Cortes but moves no money (Fase 4).
  #
  # Any payday Friday; the 14-day calendar extends both ways from here.
  CYCLE_ANCHOR_FRIDAY: "2026-08-28"
  # Habitica requires "<owner UserID>-<tool name>" on every request.
  # Fer's Habitica User ID (owner account).
  HABITICA_CLIENT: "c6ec3cd2-6b57-47fb-858d-a0f8c23b8fdd-family-agile-sync"
  HABITICA_REQUEST_DELAY: "30"
  # Rolling horizon for generate-occurrences: how many days ahead the Pendiente
  # Agenda rows are materialised. ADR-27's rule is "at least 7 so the weekly
  # view is never empty"; 14 keeps a fortnight of runway.
  GENERATE_HORIZON_DAYS: "14"
