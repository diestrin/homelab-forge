# Materialises the Pendiente Agenda rows from the Rutinas catalogue, on a
# rolling horizon (GENERATE_HORIZON_DAYS). Every other job assumes these rows
# exist, so this runs first each day -- before push-definitions and reconcile.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: family-agile-generate-occurrences
  namespace: family-agile
  labels:
    app: family-agile-sync
    job: generate-occurrences
spec:
  schedule: "30 3 * * *"
  timeZone: America/Costa_Rica
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: family-agile-sync
            job: generate-occurrences
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: ghcr.io/diestrin/homelab-forge/family-agile-sync:main
              imagePullPolicy: Always
              args: ["generate-occurrences"]
              envFrom:
                - configMapRef:
                    name: family-agile-sync-config
                - secretRef:
                    name: family-agile-sync-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
