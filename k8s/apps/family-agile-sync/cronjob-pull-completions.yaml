# Habitica -> Notion. Hourly while the family is awake: Habitica resets the
# completed flag at each cron, so a once-a-day pull would lose work.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: family-agile-pull-completions
  namespace: family-agile
  labels:
    app: family-agile-sync
    job: pull-completions
spec:
  schedule: "0 6-22 * * *"
  timeZone: America/Costa_Rica
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3000
      template:
        metadata:
          labels:
            app: family-agile-sync
            job: pull-completions
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: ghcr.io/diestrin/homelab-forge/family-agile-sync:main
              imagePullPolicy: Always
              args: ["pull-completions"]
              envFrom:
                - configMapRef:
                    name: family-agile-sync-config
                - secretRef:
                    name: family-agile-sync-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
