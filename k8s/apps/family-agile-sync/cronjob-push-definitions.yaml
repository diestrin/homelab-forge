# Notion -> Habitica. Weekly refresh of the mirrored task definitions.
#
# Habitica background tools must wait HABITICA_REQUEST_DELAY (30s) between
# calls. A full catalogue refresh is ~1100 member-mirrors, so a live run can
# take ~9h. 3000s (50m) was too short: the 2026-09-07 run died DeadlineExceeded
# and tripped A4. 12h is the safety net for a create-heavy week.
#
# Sunday 23:00 is after pull-completions' last hourly slot (22:00), so a long
# run overlaps Monday morning pulls only if it is at the long end — not the
# whole school day the old Monday 05:00 start would have.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: family-agile-push-definitions
  namespace: family-agile
  labels:
    app: family-agile-sync
    job: push-definitions
spec:
  schedule: "0 23 * * 0"
  timeZone: America/Costa_Rica
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 43200
      template:
        metadata:
          labels:
            app: family-agile-sync
            job: push-definitions
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: ghcr.io/diestrin/homelab-forge/family-agile-sync:main
              imagePullPolicy: Always
              args: ["push-definitions"]
              envFrom:
                - configMapRef:
                    name: family-agile-sync-config
                - secretRef:
                    name: family-agile-sync-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
