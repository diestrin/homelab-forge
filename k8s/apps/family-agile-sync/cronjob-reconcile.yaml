# Marks yesterday's unfinished mandatory work as Fallada. Runs after every
# member's Habitica Day Start has passed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: family-agile-reconcile
  namespace: family-agile
  labels:
    app: family-agile-sync
    job: reconcile
spec:
  schedule: "45 4 * * *"
  timeZone: America/Costa_Rica
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: family-agile-sync
            job: reconcile
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: ghcr.io/diestrin/homelab-forge/family-agile-sync:main
              imagePullPolicy: Always
              args: ["reconcile"]
              envFrom:
                - configMapRef:
                    name: family-agile-sync-config
                - secretRef:
                    name: family-agile-sync-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
