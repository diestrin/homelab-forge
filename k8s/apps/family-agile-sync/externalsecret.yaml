# Vault paths (operator creates these; never commit values):
#   secret/family-agile/notion    — token
#   secret/family-agile/habitica  — <member>_user, <member>_key for each account
#
# Habitica API tokens grant full control of an account, including deleting
# tasks. They live here and nowhere else: not in Notion, not in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: family-agile-sync-secrets
  namespace: family-agile
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: family-agile-sync-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NOTION_TOKEN: "{{ .notion_token }}"
        HABITICA_DIEGO_USER: "{{ .diego_user }}"
        HABITICA_DIEGO_KEY: "{{ .diego_key }}"
        HABITICA_FER_USER: "{{ .fer_user }}"
        HABITICA_FER_KEY: "{{ .fer_key }}"
        HABITICA_LUNA_USER: "{{ .luna_user }}"
        HABITICA_LUNA_KEY: "{{ .luna_key }}"
        HABITICA_LUCAS_USER: "{{ .lucas_user }}"
        HABITICA_LUCAS_KEY: "{{ .lucas_key }}"
        HABITICA_SOL_USER: "{{ .sol_user }}"
        HABITICA_SOL_KEY: "{{ .sol_key }}"
  data:
    - secretKey: notion_token
      remoteRef: { key: family-agile/notion, property: token }
    - secretKey: diego_user
      remoteRef: { key: family-agile/habitica, property: diego_user }
    - secretKey: diego_key
      remoteRef: { key: family-agile/habitica, property: diego_key }
    - secretKey: fer_user
      remoteRef: { key: family-agile/habitica, property: fer_user }
    - secretKey: fer_key
      remoteRef: { key: family-agile/habitica, property: fer_key }
    - secretKey: luna_user
      remoteRef: { key: family-agile/habitica, property: luna_user }
    - secretKey: luna_key
      remoteRef: { key: family-agile/habitica, property: luna_key }
    - secretKey: lucas_user
      remoteRef: { key: family-agile/habitica, property: lucas_user }
    - secretKey: lucas_key
      remoteRef: { key: family-agile/habitica, property: lucas_key }
    - secretKey: sol_user
      remoteRef: { key: family-agile/habitica, property: sol_user }
    - secretKey: sol_key
      remoteRef: { key: family-agile/habitica, property: sol_key }
