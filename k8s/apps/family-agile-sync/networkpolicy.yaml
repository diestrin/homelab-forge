# Mirrors the platform default-deny posture (k8s/platform/network-policies).
# The sync jobs need DNS and outbound HTTPS to api.notion.com and habitica.com;
# nothing needs to reach them, so there is no ingress rule at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: family-agile
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: family-agile
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-https
  namespace: family-agile
spec:
  podSelector:
    matchLabels:
      app: family-agile-sync
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
