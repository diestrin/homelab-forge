apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: forge-demo
  labels:
    app: hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: docker.io/library/nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: hello-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-html
  namespace: forge-demo
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head><meta charset="utf-8"><title>homelab-forge</title></head>
      <body>
        <h1>homelab-forge</h1>
        <p>Phase 5 forge demo on localpower.diegobarahona.com (v0.1.0 portfolio release)</p>
      </body>
    </html>
