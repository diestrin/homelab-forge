# Vault paths (operator, never commit):
#   secret/forge/postgres — username, password, database
#   secret/forge/control-plane — api_token
#   secret/forge/agents/slack — bot_token (outbound notify posts, TASK-011/ADR-011)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forge-site-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: forge-site-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        FORGE_API_TOKEN: "{{ .api_token }}"
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@forge-postgres.forge-system.svc:5432/{{ .database }}"
        SLACK_BOT_TOKEN: "{{ .slack_bot_token }}"
  data:
    - secretKey: username
      remoteRef:
        key: forge/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: forge/postgres
        property: password
    - secretKey: database
      remoteRef:
        key: forge/postgres
        property: database
    - secretKey: api_token
      remoteRef:
        key: forge/control-plane
        property: api_token
    - secretKey: slack_bot_token
      remoteRef:
        key: forge/agents/slack
        property: bot_token
