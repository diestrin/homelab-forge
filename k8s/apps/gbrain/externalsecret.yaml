# Vault path (operator, never commit values):
#   secret/forge/gbrain
#     admin_token — owner credential, [A-Za-z0-9_-]{32,} (openssl rand -hex 32)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gbrain-secrets
  namespace: gbrain
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gbrain-secrets
    creationPolicy: Owner
  data:
    - secretKey: admin_token
      remoteRef:
        key: forge/gbrain
        property: admin_token
