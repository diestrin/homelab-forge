# Headroom for the cert-manager HTTP-01 solver pod (limits.cpu 100m) on top of gbrain + postgres.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gbrain-quota
  namespace: gbrain
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 5Gi
    pods: "6"
