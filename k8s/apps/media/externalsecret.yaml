# Vault path (operator, never commit values):
#   secret/forge/media
#     qbittorrent_webui_password
#     radarr_api_key, sonarr_api_key, prowlarr_api_key  (≥ 20 chars each)
#
# jellyfin_api_key is created after the Jellyfin wizard and stored in the same
# Vault path for Jellyseerr; it is not required for this ExternalSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-secrets
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: media-secrets
    creationPolicy: Owner
  data:
    - secretKey: qbittorrent_webui_password
      remoteRef:
        key: forge/media
        property: qbittorrent_webui_password
    - secretKey: radarr_api_key
      remoteRef:
        key: forge/media
        property: radarr_api_key
    - secretKey: sonarr_api_key
      remoteRef:
        key: forge/media
        property: sonarr_api_key
    - secretKey: prowlarr_api_key
      remoteRef:
        key: forge/media
        property: prowlarr_api_key
