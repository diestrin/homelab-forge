apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyseerr
  namespace: media
  labels:
    app: jellyseerr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyseerr
  template:
    metadata:
      labels:
        app: jellyseerr
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-dirs
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              mkdir -p /media-root/config/jellyseerr
              if [ "$(stat -c %u /media-root/config/jellyseerr)" != "1000" ]; then
                chown -R 1000:1000 /media-root/config/jellyseerr
              fi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: media-root
              mountPath: /media-root
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: jellyseerr
          image: docker.io/fallenbagel/jellyseerr:2.7.3
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: media-common
                  key: TZ
            - name: LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 5055
          volumeMounts:
            - name: media-root
              mountPath: /app/config
              subPath: config/jellyseerr
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: media-root
          hostPath:
            path: /media/diestrin/data/forge/media
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: jellyseerr
  namespace: media
  labels:
    app: jellyseerr
spec:
  selector:
    app: jellyseerr
  ports:
    - name: http
      port: 5055
      targetPort: http
