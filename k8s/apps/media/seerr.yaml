# Family request UI (ADR-014). Public hostname stays
# requests.localpower.diegobarahona.com. Config directory stays
# config/jellyseerr so the first Seerr boot migrates the Jellyseerr files.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: media
  labels:
    app: seerr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-dirs
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              mkdir -p /media-root/config/jellyseerr
              chown -R 1000:1000 /media-root/config/jellyseerr
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: media-root
              mountPath: /media-root
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:v3.5.2
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: media-common
                  key: TZ
            - name: LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 5055
          volumeMounts:
            - name: media-root
              mountPath: /app/config
              subPath: config/jellyseerr
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/v1/settings/public
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/v1/settings/public
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: media-root
          hostPath:
            path: /media/diestrin/data/forge/media
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
  namespace: media
  labels:
    app: seerr
spec:
  selector:
    app: seerr
  ports:
    - name: http
      port: 5055
      targetPort: http
