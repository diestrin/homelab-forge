# Vault path (operator, never commit values):
#   secret/forge/obico
#     django_secret_key  (openssl rand -base64 48)
#     db_password        (openssl rand -hex 24; hex keeps DATABASE_URL valid)
#
# db_password is also the password of the `obico` role on forge-postgres.
# Create that role and database before merge: docs/runbooks/obico.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obico-secrets
  namespace: obico
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: obico-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DJANGO_SECRET_KEY: "{{ .django_secret_key }}"
  data:
    - secretKey: django_secret_key
      remoteRef:
        key: forge/obico
        property: django_secret_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obico-db
  namespace: obico
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: obico-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://obico:{{ .db_password }}@forge-postgres.forge-system.svc:5432/obico"
  data:
    - secretKey: db_password
      remoteRef:
        key: forge/obico
        property: db_password
