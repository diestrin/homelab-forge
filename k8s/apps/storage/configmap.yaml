# rpc_secret and admin_token come from the environment (Vault), not this file.
# Sqlite: single node, no second replica to rebuild metadata after a power loss.
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: storage
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    metadata_auto_snapshot_interval = "6h"
    replication_factor = 1
    compression_level = 1

    rpc_bind_addr = "[::]:3901"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"

    [admin]
    api_bind_addr = "127.0.0.1:3903"
