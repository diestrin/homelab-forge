# Vault path (operator, never commit values):
#   secret/forge/garage
#     rpc_secret    — 32-byte hex (openssl rand -hex 32)
#     admin_token   — openssl rand -base64 32
# Per-person S3 keys are created after boot and stored on the same path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-secrets
  namespace: storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: garage-secrets
    creationPolicy: Owner
  data:
    - secretKey: rpc_secret
      remoteRef:
        key: forge/garage
        property: rpc_secret
    - secretKey: admin_token
      remoteRef:
        key: forge/garage
        property: admin_token
