apiVersion: v1
kind: ConfigMap
metadata:
  name: github-actions-runner-config
  labels:
    app: github-actions-runner
data:
  RUNNER_URL: https://github.com/diestrin/homelab-forge
  RUNNER_NAME: forge-k3s-preview
  RUNNER_LABELS: self-hosted,k3s,forge-preview
  entrypoint.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    cd /home/runner

    if [[ ! -f .runner ]]; then
      if [[ -z "${RUNNER_TOKEN:-}" ]]; then
        echo "RUNNER_TOKEN missing — mint a registration token and update secret github-runner-registration" >&2
        exit 1
      fi
      ./config.sh \
        --url "${RUNNER_URL}" \
        --token "${RUNNER_TOKEN}" \
        --name "${RUNNER_NAME}" \
        --labels "${RUNNER_LABELS}" \
        --unattended \
        --replace
    fi

    exec ./run.sh
