# Child Applications (app-of-apps leaves). Root Application syncs this overlay;
# these make individual apps visible in the Argo UI with their own sync status.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forge-site
  namespace: forge-system
spec:
  project: default
  source:
    repoURL: https://github.com/diestrin/homelab-forge.git
    targetRevision: main
    path: k8s/apps/forge-site
  destination:
    server: https://kubernetes.default.svc
    namespace: forge-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: family-agile-sync
  namespace: forge-system
spec:
  project: default
  source:
    repoURL: https://github.com/diestrin/homelab-forge.git
    targetRevision: main
    path: k8s/apps/family-agile-sync
  destination:
    server: https://kubernetes.default.svc
    namespace: family-agile
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# kube-prometheus-stack: Prometheus Operator, Prometheus, Grafana, Alertmanager,
# kube-state-metrics, node-exporter. Values live in-repo; chart pinned below.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: forge-system
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "88.6.2"
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/k8s/platform/metrics/helm/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/diestrin/homelab-forge.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
