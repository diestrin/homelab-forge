apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# cert-manager ClusterIssuers are bootstrap-owned (ACME email must not land in git).
# cert-manager controller itself is installed by k8s/bootstrap/apply-cert-manager.sh.
# Public demo site is owned only by Application forge-site (see applications.yaml).
resources:
  - ../../platform/namespaces
  - ../../platform/network-policies
  - ../../platform/vault
  - ../../platform/external-secrets
  - ../../platform/postgres
  # metrics+logs manifests (PrometheusRule, Grafana datasource, etc.) sync via
  # Application monitoring-manifests after the monitoring Helm release installs
  # operator CRDs — see applications.yaml (also Applications loki and alloy).
  - applications.yaml
