# Minimal cluster health → ntfy via curl. Topic URL from Secret forge-system/ntfy
# (populated by ESO from Vault secret/forge/ntfy or bootstrap).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forge-alerts
  namespace: forge-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: forge-alerts
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forge-alerts
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: forge-alerts
subjects:
  - kind: ServiceAccount
    name: forge-alerts
    namespace: forge-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forge-node-alert
  namespace: forge-system
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: forge-alerts
          restartPolicy: Never
          containers:
            - name: check
              image: alpine/k8s:1.32.2
              env:
                - name: NTFY_URL
                  valueFrom:
                    secretKeyRef:
                      name: ntfy
                      key: url
                      optional: true
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  NOT_READY="$(kubectl get nodes --no-headers | awk '$2 != "Ready" {print $1}' || true)"
                  VAULT_SEALED=""
                  if kubectl -n forge-system get pod -l app=vault -o name 2>/dev/null | grep -q .; then
                    if ! kubectl -n forge-system get pod -l app=vault --field-selector=status.phase=Running -o name | grep -q .; then
                      VAULT_SEALED="vault pod not Running"
                    fi
                  fi
                  MSG=""
                  [ -n "$NOT_READY" ] && MSG="nodes not Ready: $NOT_READY; "
                  [ -n "$VAULT_SEALED" ] && MSG="${MSG}${VAULT_SEALED}; "
                  if [ -z "$MSG" ]; then
                    echo "ok"
                    exit 0
                  fi
                  echo "alert: $MSG"
                  if [ -n "${NTFY_URL:-}" ]; then
                    wget -qO- --header="Title: homelab-forge k3s" --post-data="$MSG" "$NTFY_URL" || true
                  fi
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
