# Merges ntfy URL into alertmanager-notifications (shared with Slack webhook from externalsecret-slack.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-ntfy
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-notifications
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        ntfy_url: "{{ .url }}"
  data:
    - secretKey: url
      remoteRef:
        key: forge/ntfy
        property: url
