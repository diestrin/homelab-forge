# Vault paths:
#   secret/forge/ntfy — key: url
#   secret/forge/alerts/slack — key: webhook_url
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-notifications
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-notifications
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ntfy_url: "{{ .ntfy_url }}"
        slack_webhook_url: "{{ .slack_webhook_url }}"
  data:
    - secretKey: ntfy_url
      remoteRef:
        key: forge/ntfy
        property: url
    - secretKey: slack_webhook_url
      remoteRef:
        key: forge/alerts/slack
        property: webhook_url
