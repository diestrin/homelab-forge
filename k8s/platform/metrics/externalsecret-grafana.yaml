# Vault path: secret/forge/grafana — keys: admin_user, admin_password
# Example (operator, never commit):
#   vault kv put secret/forge/grafana admin_user=admin admin_password="$(openssl rand -base64 24)"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        admin-user: "{{ .admin_user }}"
        admin-password: "{{ .admin_password }}"
  data:
    - secretKey: admin_user
      remoteRef:
        key: forge/grafana
        property: admin_user
    - secretKey: admin_password
      remoteRef:
        key: forge/grafana
        property: admin_password
