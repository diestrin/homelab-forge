apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy
  namespace: forge-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ntfy
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: forge/ntfy
        property: url
