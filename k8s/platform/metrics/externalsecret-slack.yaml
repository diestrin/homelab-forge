# Vault path: secret/forge/alerts/slack — key: webhook_url (Incoming Webhook for #forge-alerts).
# Example (operator, never commit):
#   vault kv put secret/forge/alerts/slack webhook_url=https://hooks.slack.com/services/PLACEHOLDER
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-notifications
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        slack_webhook_url: "{{ .webhook_url }}"
  data:
    - secretKey: webhook_url
      remoteRef:
        key: forge/alerts/slack
        property: webhook_url
