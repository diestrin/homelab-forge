# Forge platform alerts A1–A8 (see factory/plans/TASK-012.md).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: forge-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: homelab-forge
spec:
  groups:
    - name: forge.node
      interval: 30s
      rules:
        - alert: ForgeNodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
            forge_alert_id: A1
          annotations:
            summary: "Node {{ $labels.node }} is NotReady (A1)"
            description: "Kubernetes node {{ $labels.node }} has been NotReady for more than 5 minutes. Check `kubectl get nodes` and kubelet/journal on the host."

        - alert: ForgeNodePressure
          expr: kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure",status="true"} == 1
          for: 5m
          labels:
            severity: critical
            forge_alert_id: A2
          annotations:
            summary: "Node {{ $labels.node }} reports {{ $labels.condition }} (A2)"
            description: "Node {{ $labels.node }} has active condition {{ $labels.condition }} for more than 5 minutes. Free disk/memory or inspect PID pressure before workloads evict."

        - alert: ForgeNodeHighMemory
          expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
          for: 10m
          labels:
            severity: warning
            forge_alert_id: A3
          annotations:
            summary: 'Memory {{ $value | printf "%.0f" }}% on {{ $labels.instance }} (A3)'
            description: 'Instance {{ $labels.instance }} memory use is {{ $value | printf "%.1f" }}% (threshold 85%) for 10 minutes. Check Grafana Forge Overview / Node Exporter dashboards.'

        - alert: ForgeNodeHighCPU
          expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
          for: 10m
          labels:
            severity: warning
            forge_alert_id: A3
          annotations:
            summary: 'CPU {{ $value | printf "%.0f" }}% on {{ $labels.instance }} (A3)'
            description: 'Instance {{ $labels.instance }} CPU use is {{ $value | printf "%.1f" }}% (threshold 90%) for 10 minutes. Check top consumers in Grafana Node Exporter dashboard.'

    - name: forge.argocd
      interval: 30s
      rules:
        - alert: ForgeArgoAppUnhealthy
          expr: |
            argocd_app_info{health_status=~"Degraded|Missing|Unknown",name=~"forge-site|family-agile-sync|forge-root"} == 1
          for: 15m
          labels:
            severity: critical
            forge_alert_id: A4
          annotations:
            summary: "Argo app {{ $labels.name }} is {{ $labels.health_status }} (A4)"
            description: "Application {{ $labels.name }} health has been {{ $labels.health_status }} for 15 minutes. Inspect the app in Argo CD (port-forward) and recent sync/resource events."

        - alert: ForgeArgoAppOutOfSync
          expr: |
            argocd_app_info{sync_status="OutOfSync",name=~"forge-site|family-agile-sync|forge-root"} == 1
          for: 30m
          labels:
            severity: warning
            forge_alert_id: A5
          annotations:
            summary: "Argo app {{ $labels.name }} OutOfSync (A5)"
            description: "Application {{ $labels.name }} has been OutOfSync for 30 minutes. Diff against git `main` and sync (or fix the drift) via Argo CD."

    - name: forge.workloads
      interval: 30s
      rules:
        - alert: ForgePodCrashLooping
          expr: |
            kube_pod_container_status_waiting_reason{reason=~"CrashLoopBackOff|ImagePullBackOff",namespace=~"forge-demo|forge-system|family-agile|forge-agents"} == 1
          for: 10m
          labels:
            severity: warning
            forge_alert_id: A6
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} {{ $labels.reason }} (A6)"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} is {{ $labels.reason }} for 10 minutes. Check `kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}` and recent logs."

        - alert: ForgeDeploymentNotReady
          expr: |
            (
              kube_deployment_spec_replicas{namespace=~"forge-demo|forge-system|family-agile|forge-agents"} > 0
            )
            and
            (
              kube_deployment_status_replicas_available{namespace=~"forge-demo|forge-system|family-agile|forge-agents"}
              != kube_deployment_spec_replicas{namespace=~"forge-demo|forge-system|family-agile|forge-agents"}
            )
          for: 15m
          labels:
            severity: warning
            forge_alert_id: A7
          annotations:
            summary: "Deploy {{ $labels.namespace }}/{{ $labels.deployment }} replicas not ready (A7)"
            description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas for 15 minutes. Compare desired vs available and inspect ReplicaSet/pod events."

    - name: forge.platform
      interval: 30s
      rules:
        - alert: ForgeVaultNotRunning
          expr: |
            (
              kube_deployment_spec_replicas{namespace="forge-system",deployment="vault"} > 0
            )
            unless
            (
              kube_deployment_status_replicas_available{namespace="forge-system",deployment="vault"}
              == kube_deployment_spec_replicas{namespace="forge-system",deployment="vault"}
            )
          for: 5m
          labels:
            severity: critical
            forge_alert_id: A8
          annotations:
            summary: "Vault deployment not fully available (A8)"
            description: "Vault in forge-system has fewer ready replicas than desired for 5 minutes. Follow docs/runbooks/vault.md (unseal / pod health) before other secrets-dependent apps recover."
