# Vault path: secret/forge/postgres — keys: username, password, database
# Example (operator, never commit):
#   vault kv put secret/forge/postgres username=forge password=… database=forge
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forge-postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: forge-postgres
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_USER: "{{ .username }}"
        POSTGRES_PASSWORD: "{{ .password }}"
        POSTGRES_DB: "{{ .database }}"
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@forge-postgres.forge-system.svc:5432/{{ .database }}"
  data:
    - secretKey: username
      remoteRef:
        key: forge/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: forge/postgres
        property: password
    - secretKey: database
      remoteRef:
        key: forge/postgres
        property: database
