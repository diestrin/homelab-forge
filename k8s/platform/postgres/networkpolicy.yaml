apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forge-postgres
spec:
  podSelector:
    matchLabels:
      app: forge-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forge-demo
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forge-system
      ports:
        - protocol: TCP
          port: 5432
