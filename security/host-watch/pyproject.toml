[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "host-watch"
version = "0.1.0"
description = "Periodic host process/network suspicion scanner with ntfy alerts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "diestrin" }]
dependencies = []

[project.scripts]
host-watch = "host_watch.__main__:main"

[tool.setuptools.packages.find]
include = ["host_watch*"]
